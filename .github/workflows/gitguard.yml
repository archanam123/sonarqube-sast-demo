
name: GitGuardian Secret Scanning

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Secret Scanning on Push
  # ─────────────────────────────────────────────────────
  gitguardian-push-scan:
    name: GitGuardian - Push Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for secret detection

      - name: Run GitGuardian Secret Scan (Push)
        uses: GitGuardian/ggshield-action@v1
        with:
          args: secret scan ci
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ─────────────────────────────────────────────────────
  # JOB 2: Secret Scanning on Pull Request
  # ─────────────────────────────────────────────────────
  gitguardian-pr-scan:
    name: GitGuardian - Pull Request Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitGuardian Secret Scan (PR)
        uses: GitGuardian/ggshield-action@v1
        with:
          args: secret scan ci
        env:
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ─────────────────────────────────────────────────────
  # JOB 3: Full Repository Historical Scan
  # ─────────────────────────────────────────────────────
  gitguardian-repo-scan:
    name: GitGuardian - Full Repo Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for historical scan

      - name: Install ggshield
        run: pip install ggshield

      - name: Run Full Repository Scan
        run: ggshield secret scan repo .
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ─────────────────────────────────────────────────────
  # JOB 4: Docker Image Secret Scan (Optional)
  # ─────────────────────────────────────────────────────
  gitguardian-docker-scan:
    name: GitGuardian - Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ggshield
        run: pip install ggshield

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .
        continue-on-error: true  # Skip if no Dockerfile

      - name: Scan Docker Image for Secrets
        run: ggshield secret scan docker myapp:${{ github.sha }}
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true  # Skip if no Docker image was built

  # ─────────────────────────────────────────────────────
  # JOB 5: Dependency / IaC File Scan
  # ─────────────────────────────────────────────────────
  gitguardian-iac-scan:
    name: GitGuardian - IaC & Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ggshield
        run: pip install ggshield

      - name: Scan IaC and Config Files
        run: |
          ggshield iac scan all . \
            --minimum-severity HIGH \
            --ignore-path "**/*.md" \
            --ignore-path "**/test*/**"
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true  # Report but don't block

  # ─────────────────────────────────────────────────────
  # JOB 6: Notify on Secret Detection
  # ─────────────────────────────────────────────────────
  notify-on-failure:
    name: Notify Security Team
    runs-on: ubuntu-latest
    needs:
      - gitguardian-push-scan
      - gitguardian-pr-scan
    if: failure()

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *SECRET DETECTED* in `${{ github.repository }}`",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch",     "value": "${{ github.ref_name }}",   "short": true },
                    { "title": "Commit",     "value": "${{ github.sha }}",        "short": true },
                    { "title": "Triggered by", "value": "${{ github.actor }}",   "short": true },
                    { "title": "Action URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
